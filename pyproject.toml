[project]
name = "gridfinity-tool-studio"
version = "0.1.0"
description = "Turn a photo of a hand tool into a 3D-printable gridfinity bin with a tool-shaped pocket."
license = "MIT"
requires-python = ">=3.11"

[tool.ruff]
lint.select = ["F"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["src"]
